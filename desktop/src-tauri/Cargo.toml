[package]
name = "dicom-node-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Desktop UI for dicom-node-client"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThalesMMS/rusty-dicom-node"

[lib]
name = "dicom_node_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dicom-node-client = { path = "../.." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
strip = true
lto = true
